name = "stackhk-worker"
main = "_worker.js"
compatibility_date = "2024-01-01"

# 静态资源
[site]
bucket = "./"

# KV namespace binding
[[kv_namespaces]]
binding = "STACKHK"
id = "ed9ee39834274da286d7f06aaaa7e5f9"

# 变量（生产环境请改用 `wrangler secret put ADMIN_PASSWORD_HASH` 与
# `wrangler secret put ADMIN_TOKEN_SECRET`，避免明文提交到仓库）
[vars]
ENVIRONMENT = "production"
ADMIN_USERNAME = "Stackhk007"
# SHA-256 hash of the admin password (never store the plaintext password)
ADMIN_PASSWORD_HASH = "e66d98212d93ebfb4d2eda348354d1773d2d4310323bf2700f2a4e922e79bfc3"
# Secret used to sign admin session tokens (change this in production via wrangler secret)
ADMIN_TOKEN_SECRET = "stackhk-prod-secret-9f3a1c7b"
ADMIN_TOKEN_TTL = "86400000"

[env.dev]
name = "stackhk-worker-dev"
[env.dev.vars]
ENVIRONMENT = "development"

[env.production]
name = "stackhk-worker-prod"
[env.production.vars]
ENVIRONMENT = "production"
